[changelog]
header = ""
body = """
## {{ version }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first }} ([{{ commit.id | truncate(length=8, end="") }}](https://github.com/pascalandy/nicely/commit/{{ commit.id }}))
{% endfor -%}
{% endfor -%}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
# Convert "<emoji> <type>: <scope>: <summary>" before conventional parsing.
commit_preprocessors = [
  { pattern = '^\S+ ([a-z]+): ([^:\r\n]+): ', replace = '${1}(${2}): ' },
  { pattern = '^[^\x00-\x7F]+ ([a-z]+): ', replace = '${1}: ' },
]
commit_parsers = [
  { message = '^feat\b', group = "Features" },
  { message = '^fix\b', group = "Fixes" },
  { message = '^security\b', group = "Security" },
  { message = '^perf\b', group = "Performance" },
  { message = '^refactor\b', group = "Refactoring" },
  { message = '^remove\b', group = "Removed" },
  { message = '^docs\b', group = "Documentation" },
  { message = '^skill\b', group = "Skills" },
  { message = '^test\b', group = "Tests" },
  { message = '^style\b', group = "Style" },
  { message = '^chore\b', group = "Maintenance" },
  { message = '^wip\b', group = "Work in progress" },
  { message = '.*', group = "Other" },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "newest"

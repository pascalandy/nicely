# Run `lefthook install` once per clone. To reproduce a hook failure, run its just recipe
output:
  - execution_out
  - failure

pre-commit:
  piped: true
  commands:
    1_fmt:
      glob: "*.go"
      run: just fmt {staged_files}
      stage_fixed: true
    2_lint:
      glob: "*.go"
      run: just lint
    3_gitleaks:
      run: just gitleaks-staged
    4_agents_size:
      glob: "AGENTS.md"
      run: just agents-size

pre-push:
  commands:
    test:
      run: just test

# Fleet sync: when a fetch or a push moves origin's default branch, each
# machine of the fleet fast-forwards this clone; see the fleet skill
rc: ~/.claude/skills/fleet/scripts/lefthook_rc.sh

reference-transaction:
  commands:
    fleet-sync:
      use_stdin: true
      run: test ! -f ~/.claude/skills/fleet/scripts/fleet_sync.sh || sh ~/.claude/skills/fleet/scripts/fleet_sync.sh {1}

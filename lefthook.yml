# Run `lefthook install` once per clone. To reproduce a hook failure, run its just recipe
output:
  - execution_out
  - failure

pre-commit:
  piped: true
  commands:
    1_fmt:
      glob: "*.go"
      run: just fmt {staged_files}
      stage_fixed: true
    2_lint:
      glob: "*.go"
      run: just lint
    3_gitleaks:
      run: just gitleaks-staged

pre-push:
  commands:
    test:
      run: just test

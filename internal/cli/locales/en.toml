# Core's English catalog: the text of core's commands and of the extension
# host. Each entry needs a description of where the text appears.

["root.summary"]
description = "One-line description of ncly at the top of its help page."
other = "Curated CLI toolbox for humans and AI agents."

["help.summary"]
description = "Help page: summary of the `help` command, which prints the help of another command."
other = "Show help for a command"

["completion.summary"]
description = "Help page: summary of `ncly completion`, which prints scripts that let a shell complete ncly commands."
other = "Print shell completion scripts"

["completion.zsh_summary"]
description = "Help page: summary of `ncly completion zsh`. zsh is the name of a shell and stays as is."
other = "Print the completion script for zsh"

["completion.bash_summary"]
description = "Help page: summary of `ncly completion bash`. bash is the name of a shell and stays as is."
other = "Print the completion script for bash"

["completion.fish_summary"]
description = "Help page: summary of `ncly completion fish`. fish is the name of a shell and stays as is."
other = "Print the completion script for fish"

["describe.summary"]
description = "Help page and ncly describe: summary of `ncly describe`, which lists installed commands and tells what each one accepts, answers, and needs."
other = "Describe installed commands and their capabilities"

["describe.command"]
description = "Help page: the argument of `ncly describe`, the words of a command path, such as `completion zsh`."
other = "Path of a command or a group, such as completion zsh"

["describe.not_found"]
description = "Error of `ncly describe` when no installed command has the path that the user gave. {{.Path}} is that path, such as hello run, and stays as is."
other = "No command \"{{.Path}}\" is installed."

["help.extensions"]
description = "Help page: heading above the list of installed extensions, each a domain such as transcript."
other = "Extensions"

["extension.invalid"]
description = "Error when an installed extension cannot run. {{.Domain}} is its domain, such as hello, and stays as is. {{.Reason}} is one of the extension.* sentences, already translated."
other = "The extension {{.Domain}} cannot run: {{.Reason}}"

["extension.invalid_hint"]
description = "Hint under extension.invalid: what the user does next. {{.Path}} is the path of the extension's executable."
other = "Fix or reinstall the extension at {{.Path}}."

["extension.file_missing"]
description = "Reason inside extension.invalid. {{.File}} is the name of a file of the extension, such as ncly-hello.toml."
other = "{{.File}} is missing."

["extension.file_unreadable"]
description = "Reason inside extension.invalid, when ncly lacks the permission to read a file. {{.File}} is the name of the file, such as ncly-hello.toml."
other = "{{.File}} cannot be read."

["extension.file_syntax"]
description = "Reason inside extension.invalid. {{.File}} is the name of the file, such as ncly-hello.toml, and {{.Line}} a line number. TOML is the name of a file format and stays as is."
other = "{{.File}} has a TOML syntax error on line {{.Line}}."

["extension.file_invalid"]
description = "Reason inside extension.invalid, when a file is not valid TOML or not a catalog. {{.File}} is the name of the file, such as ncly-hello.locales/en.toml."
other = "{{.File}} is not in the expected format."

["extension.format_version"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, format_version a key that stays as is, {{.Value}} the number it holds, and {{.Want}} the only number this ncly reads."
other = "{{.File}} has format_version {{.Value}}, and this ncly reads only {{.Want}}."

["extension.contract_version"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, contract_version a key that stays as is, {{.Value}} the number it holds, and {{.Want}} the only number this ncly speaks."
other = "{{.File}} has contract_version {{.Value}}, and this ncly speaks only {{.Want}}."

["extension.domain"]
description = "Reason inside extension.invalid, when the manifest names a domain other than its executable's. {{.File}} is the manifest's name, {{.Value}} the domain it declares, and {{.Want}} the domain of the executable."
other = "{{.File}} declares the domain \"{{.Value}}\" instead of {{.Want}}."

["extension.domain_command"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Path}} the domain, such as hello, which needs a command of its own."
other = "{{.File}} declares no command for the domain {{.Path}}."

["extension.path"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Path}} a command path, such as hello run."
other = "{{.File}} declares the command \"{{.Path}}\", whose words must be lowercase letters, digits, and hyphens."

["extension.path_domain"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Domain}} the extension's domain, which must be its first word."
other = "{{.File}} declares the command \"{{.Path}}\", which does not start with {{.Domain}}."

["extension.path_twice"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Path}} a command path, such as hello run."
other = "{{.File}} declares the command \"{{.Path}}\" twice."

["extension.parent"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path such as hello profile list, and {{.Parent}} the path above it, such as hello profile."
other = "{{.File}} declares the command \"{{.Path}}\" without \"{{.Parent}}\" above it."

["extension.result"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Value}} the kind of result it declares, which ncly does not know."
other = "{{.File}} gives the command \"{{.Path}}\" the unknown result kind \"{{.Value}}\"."

["extension.name"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of one of its flags, arguments, or values."
other = "{{.File}} gives the command \"{{.Path}}\" the name \"{{.Name}}\", which must be lowercase letters, digits, and hyphens."

["extension.shorthand"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the shorthand of one of its flags, such as g in -g."
other = "{{.File}} gives the command \"{{.Path}}\" the shorthand \"{{.Name}}\", which must be one ASCII letter."

["extension.values_from_switch"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of one of its flags, a switch. values_from is a key and stays as is."
other = "{{.File}} gives the switch \"{{.Name}}\" of the command \"{{.Path}}\" a values_from, which only an argument or a flag that takes a value may have."

["extension.values_from_empty"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of one of its arguments or flags. values_from, command, key, and field are keys and stay as is."
other = "{{.File}} gives \"{{.Name}}\" of the command \"{{.Path}}\" a values_from without its command, key, and field."

["extension.values_from_command"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, {{.Name}} the name of one of its arguments or flags, and {{.Command}} the path of a command of the same manifest. values_from and list are words of the contract and stay as is."
other = "{{.File}} gives \"{{.Name}}\" of the command \"{{.Path}}\" a values_from on \"{{.Command}}\", which must be a list command of the manifest that takes no argument, answers an object, and declares effects that neither write user files nor bill."

["extension.flag_taken"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} a flag such as --json, --dry-run, or -v. --dry-run and --run-id are flags and stay as is."
other = "{{.File}} gives the command \"{{.Path}}\" the flag {{.Name}}, which a global flag, --dry-run, --run-id, or another of its flags already uses."

["extension.type"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, {{.Name}} the name of one of its arguments or flags, and {{.Value}} the type it declares. string, boolean, integer, and number are type names and stay as is."
other = "{{.File}} gives \"{{.Name}}\" of the command \"{{.Path}}\" the type \"{{.Value}}\", and a value is a string, boolean, integer, or number, a switch a boolean."

["extension.required"]
description = "Reason inside extension.invalid, when a switch or an argument after an optional one is required. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of the argument or the flag."
other = "{{.File}} makes \"{{.Name}}\" of the command \"{{.Path}}\" required, which neither a switch nor an argument after an optional one may be."

["extension.variadic"]
description = "Reason inside extension.invalid, when a switch or an argument other than the last takes several values. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of the argument or the flag."
other = "{{.File}} makes \"{{.Name}}\" of the command \"{{.Path}}\" take several values, which only the last argument and a flag that takes a value may."

["extension.values"]
description = "Reason inside extension.invalid, when the accepted values of an argument or a flag do not fit it. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of the argument or the flag. values is a key and stays as is."
other = "{{.File}} gives \"{{.Name}}\" of the command \"{{.Path}}\" values that do not fit it: none, one that appears twice, one that its type does not read, or values on a switch."

["extension.default"]
description = "Reason inside extension.invalid, when the default of a flag does not fit it. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of the flag."
other = "{{.File}} gives the flag \"{{.Name}}\" of the command \"{{.Path}}\" a default that does not fit it: of another type, a number that is not finite, a default on a required flag or a flag with several values, or a switch's default other than false."

["extension.flag_group"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Value}} the flags of one of its groups, such as --latest, --path. min and max are keys and stay as is."
other = "{{.File}} gives the command \"{{.Path}}\" the group of flags {{.Value}}, and a group names at least two of the command's own flags, each once, with 0 <= min <= max <= their number and max at least 1."

["extension.bin"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} a program name from its requires.bins. requires.bins and programs are keys and stay as is."
other = "{{.File}} lists \"{{.Name}}\" in requires.bins of the command \"{{.Path}}\", which must name a key of programs once."

["extension.program_version"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Name}} a program of its programs table, such as ffmpeg, and {{.Value}} the version that it declares."
other = "{{.File}} gives the program \"{{.Name}}\" the version \"{{.Value}}\", which must be numbers joined by dots, such as 6.0."

["extension.program_probe"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Name}} a program of its programs table, such as ffmpeg, whose probe, the arguments that make it print its version, is empty."
other = "{{.File}} gives the program \"{{.Name}}\" an empty probe, which must hold at least one argument."

["extension.program_install"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Name}} a program of its programs table, such as ffmpeg, and {{.Manager}} the name of a package manager, such as brew or pacman, which stays as is."
other = "{{.File}} gives the program \"{{.Name}}\" an empty install command for \"{{.Manager}}\"."

["extension.doctor"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Path}} a command path, such as hello run, which sets doctor, a key that stays as is, as do report, live, timeout, effects, and the mode names."
other = "{{.File}} sets doctor on the command \"{{.Path}}\", which must be the status command of its domain: <domain> status, a report without arguments or flag groups, whose only flags are live, a switch that defaults to false, and timeout, a string, neither required nor with values, with effects that neither write nor bill, live when they use the network, and no mode."

["extension.key"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} a service name from its requires.keys, such as deepgram. requires.keys, keychain, and grants stay as is."
other = "{{.File}} lists \"{{.Name}}\" in requires.keys of the command \"{{.Path}}\", which must name a service once, in lowercase letters and digits that start with a letter, other than keychain and grants."

["extension.config_key"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, {{.Name}} a config key that the command declares, such as hello.greeting, and {{.Domain}} the extension's domain, which starts each key. config is a key and stays as is."
other = "{{.File}} lists \"{{.Name}}\" in config of the command \"{{.Path}}\", which must name a key under {{.Domain}} once, as words of lowercase letters, digits, hyphens, and underscores joined by dots."

["doctor.summary"]
description = "Help page and ncly describe: summary of `ncly doctor`, which checks the config, the programs, and the extensions of this machine, and never installs anything."
other = "Check this machine's config, tools, and extensions"

["doctor.component"]
description = "Help page: summary of the component argument of `ncly doctor`, a part that doctor checks, such as core or the domain of an extension."
other = "The part to check, such as core; all of them when omitted"

["doctor.live"]
description = "Help page: summary of the --live switch of `ncly doctor`, which adds network checks against free endpoints, passed on to each status command that declares it."
other = "Add network checks against free endpoints, which never bill"

["doctor.status_invalid"]
description = "Report of `ncly doctor`: message of the failed <domain>.status check when doctor rejects the answer of an extension's status command. {{.Domain}} is the extension's domain, and {{.Reason}} the rule that the answer breaks, a sentence that ends with a period."
other = "The status command of {{.Domain}} gave an answer that doctor rejects: {{.Reason}}"

["doctor.status_failed"]
description = "Report of `ncly doctor`: message of the failed <domain>.status check when an extension's status command failed with an exit code that is neither 0 nor 78. {{.Domain}} is the domain, and {{.Exit}} the exit code."
other = "The status command of {{.Domain}} failed with exit {{.Exit}}."

["doctor.status_timeout"]
description = "Report of `ncly doctor`: message of the failed <domain>.status check when an extension's status command had not answered when the time of --timeout ended. {{.Domain}} is the domain, and --timeout a flag that stays as is."
other = "The status command of {{.Domain}} did not answer within --timeout."

["doctor.rule_shape"]
description = "Reason inside doctor.status_invalid: a check of a status command's answer is no check object. {{.Index}} counts the checks from 1. id, component, status, message, pass, warn, and fail are keys and values that stay as is."
other = "its check {{.Index}} is no check of a status command, with a status of pass, warn, or fail, a message, and no key of the extensions component."

["doctor.rule_component"]
description = "Reason inside doctor.status_invalid: a check of a status command belongs to another component. {{.Index}} counts the checks from 1, {{.ID}} and {{.Component}} are the check's id and component, and {{.Domain}} the extension's domain."
other = "its check {{.Index}}, {{.ID}} of the component {{.Component}}, must belong to {{.Domain}}, with an id that starts with {{.Domain}} and a dot."

["doctor.rule_code"]
description = "Reason inside doctor.status_invalid: the code of a check does not fit its status. {{.Index}} counts the checks from 1, {{.ID}} is its id, {{.Status}} its status, pass, warn, or fail, and {{.Code}} its code. The status words stay as is."
other = "its check {{.Index}}, {{.ID}}, has the status {{.Status}} with the code \"{{.Code}}\": a pass has no code nor hint, a fail has a code that maps to exit 78, and a warn has a warning code."

["doctor.rule_hint"]
description = "Reason inside doctor.status_invalid: a check that warns or fails lacks its hint, or its next is no list of words. {{.Index}} counts the checks from 1, and {{.ID}} is its id. next is a key that stays as is."
other = "its check {{.Index}}, {{.ID}}, lacks a hint, or its next is no list of words."

["doctor.rule_checks"]
description = "Reason inside doctor.status_invalid: the report of a status command holds no array under checks, a key that stays as is."
other = "it holds no checks array."

["doctor.rule_lead"]
description = "Reason inside doctor.status_invalid: a status command failed with exit 78 under a code that neither core nor its manifest maps to exit 78. {{.Code}} is that code, which stays as is."
other = "it failed with {{.Code}}, which maps to no exit code of its domain."

["doctor.rule_verdict"]
description = "Reason inside doctor.status_invalid: the exit code of a status command disagrees with its checks. {{.Exit}} is the exit code."
other = "it exited with {{.Exit}}, while a report exits 78 exactly when one of its checks fails."

["doctor.timeout"]
description = "Help page: summary of the --timeout flag of `ncly doctor`, which bounds the checks. 30s and the examples are durations that stay as is."
other = "Bound the checks, such as 45s, 2m, or a number of seconds"

["doctor.timeout_invalid"]
description = "Usage error of `ncly doctor` when the value of --timeout is no duration above 0. {{.Value}} is that value. 30s, 5m, 2h, and --timeout stay as is."
other = "\"{{.Value}}\" is no duration for --timeout: use 30s, 5m, 2h, or a number of seconds above 0."

["doctor.program_found"]
description = "Report of `ncly doctor`: message of the check of a program that an extension requires, found in PATH. {{.Name}} is the program, such as ffmpeg, and {{.Path}} where it was found."
other = "{{.Name}} found at {{.Path}}."

["doctor.program_version"]
description = "Report of `ncly doctor`: message of the check of a program found in PATH whose version is recent enough. {{.Name}} is the program, {{.Found}} the version that it printed, such as 6.1.1, and {{.Path}} where it was found."
other = "{{.Name}} {{.Found}} found at {{.Path}}."

["doctor.program_missing"]
description = "Report of `ncly doctor`: message of the failed check of a program that an extension requires and that no folder of PATH holds. {{.Name}} is the program, such as ffmpeg."
other = "{{.Name}} is not installed."

["doctor.program_old"]
description = "Report of `ncly doctor`: message of the failed check of a program older than the version that an extension needs. {{.Name}} is the program, {{.Found}} the version that it printed, and {{.Version}} the oldest version that works."
other = "{{.Name}} {{.Found}} is older than {{.Version}}."

["doctor.program_probe_failed"]
description = "Report of `ncly doctor`: message of the failed check of a program whose version probe exited with an error. {{.Probe}} is the command that doctor ran, such as ffmpeg -version, which stays as is, and {{.Exit}} its exit code."
other = "{{.Probe}} exited with {{.Exit}}, so its version is unknown."

["doctor.program_no_version"]
description = "Report of `ncly doctor`: message of the failed check of a program whose version probe printed no version number. {{.Probe}} is the command that doctor ran, such as ffmpeg -version, which stays as is."
other = "{{.Probe}} printed no version."

["doctor.program_install"]
description = "Report of `ncly doctor`: hint of a failed program check when no install command is known for this machine. {{.Name}} is the program, such as ffmpeg."
other = "Install {{.Name}}."

["doctor.program_timeout"]
description = "Report of `ncly doctor`: message of the check of a program whose version probe still ran when the time of --timeout ended. {{.Probe}} is the command that doctor ran, such as ffmpeg -version, and --timeout a flag; both stay as is."
other = "{{.Probe}} did not finish within --timeout."

["doctor.not_started"]
description = "Report of `ncly doctor`: message of a check that doctor never started, because the time of --timeout had ended. {{.Name}} is what the check examines, such as ffmpeg."
other = "Doctor ran out of time before it checked {{.Name}}."

["doctor.timeout_hint"]
description = "Report of `ncly doctor`: hint of a check that failed because the time of --timeout ended. ncly doctor and --timeout stay as is."
other = "Run ncly doctor again with a longer --timeout."

["doctor.no_component"]
description = "Error of `ncly doctor` when its argument names no component. {{.Component}} is that argument, and {{.Components}} the names of the components, such as core, which stay as is."
other = "Doctor has no component {{.Component}}. Its components are: {{.Components}}."

["doctor.status_pass"]
description = "Report of `ncly doctor`: the label of a check that passed, before its id. A short word, as the labels of a warning and of a failure."
other = "pass"

["doctor.status_warn"]
description = "Report of `ncly doctor`: the label of a check that found a problem that never fails the report, before its id."
other = "warn"

["doctor.status_fail"]
description = "Report of `ncly doctor`: the label of a check that failed and needs a human, before its id."
other = "fail"

["doctor.config_valid"]
description = "Report of `ncly doctor`: message of the core.config check when every config file parses and holds only known keys, or when there is none."
other = "The config files are valid."

["doctor.config_unreadable"]
description = "Report of `ncly doctor`: message of the failed core.config check when a config file cannot be read. {{.File}} is the path of the file."
other = "{{.File}} cannot be read."

["doctor.config_invalid_line"]
description = "Report of `ncly doctor`: message of the failed core.config check when a config file has an error on a known line. {{.File}} is the path of the file, and {{.Line}} a line number."
other = "{{.File}} has an error on line {{.Line}}."

["doctor.config_invalid_hint"]
description = "Report of `ncly doctor`: hint of the failed core.config check, what the user does next. {{.File}} is the path of the config file."
other = "Fix {{.File}}."

["doctor.unknown_key"]
description = "Report of `ncly doctor`: message of a core.config warning about a config key that neither ncly nor an installed extension knows. {{.File}} is the path of the file, and {{.Key}} the key, such as hello.volume, which stays as is."
other = "{{.File}} holds the unknown key {{.Key}}."

["doctor.unknown_key_hint"]
description = "Report of `ncly doctor`: hint under doctor.unknown_key, what the user does next. {{.Key}} is the key, which stays as is, and {{.File}} the path of the file."
other = "Remove or rename {{.Key}} in {{.File}}."

["doctor.extension_runs"]
description = "Report of `ncly doctor`: message of the extensions.<domain> check of an extension that runs. {{.Domain}} is its domain, such as transcript, and {{.Path}} the path of its executable."
other = "{{.Domain}} runs from {{.Path}}."

["doctor.extension_bundled"]
description = "Report of `ncly doctor`: message of the extensions.<domain> check of an extension compiled into ncly, which runs. {{.Domain}} is its domain, such as skill."
other = "{{.Domain}} is bundled with ncly."

["doctor.extension_hidden"]
description = "Report of `ncly doctor`: message of the extensions.<domain> check of an extension that never runs, because discovery finds another one of the same domain first. {{.Path}} is the path of the hidden executable, and {{.Winner}} the path of the one that runs."
other = "{{.Path}} never runs, because {{.Winner}} comes first."

["doctor.extension_hidden_by_core"]
description = "Report of `ncly doctor`: message of the extensions.<domain> check of an executable that never runs, because core keeps its name for one of its own commands. {{.Path}} is the path of the executable, and {{.Domain}} the name, such as describe, which stays as is."
other = "{{.Path}} never runs, because ncly reserves the name {{.Domain}}."

["doctor.extension_hidden_by_bundled"]
description = "Report of `ncly doctor`: message of the extensions.<domain> check of an executable that never runs, because ncly bundles an extension of the same domain. {{.Path}} is the path of the executable, and {{.Domain}} the domain, such as skill, which stays as is."
other = "{{.Path}} never runs, because ncly bundles the extension {{.Domain}}."

["describe.defaults_used"]
description = "Warning of `ncly describe` when a config file cannot be read, so the configuration that it reports is the default one. {{.File}} is the path of the file."
other = "{{.File}} cannot be read, so the configuration shown is the default one."

["describe.defaults_used_line"]
description = "Warning of `ncly describe` when a config file has an error on a known line, so the configuration that it reports is the default one. {{.File}} is the path of the file, and {{.Line}} a line number."
other = "{{.File}} has an error on line {{.Line}}, so the configuration shown is the default one."

["describe.defaults_used_hint"]
description = "Hint under describe.defaults_used: what the user does next. {{.File}} is the path of the config file."
other = "Fix {{.File}}."

["extension.schema"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the key of a schema, schema or dry_run_schema, which stays as is, as do JSON Schema, $ref, type, properties, required, title, description, and text."
other = "{{.File}} gives the command \"{{.Path}}\" a {{.Name}} that is not a JSON Schema of an object's keys, with only type, properties, required, title, and description at its top and local $ref only, or that a text result, or a command without dry run for dry_run_schema, cannot have."

["extension.program"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Name}} a program of its programs table, such as ffmpeg. programs and requires.bins are keys and stay as is."
other = "{{.File}} declares the program \"{{.Name}}\" in programs, which must be a file name without / that the requires.bins of a command names."

["extension.code_prefix"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Code}} an error code, and {{.Prefix}} the start that the extension's codes need, such as HELLO_."
other = "{{.File}} declares the error code {{.Code}}, which does not start with {{.Prefix}}."

["extension.code_core"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Code}} an error code that belongs to ncly itself."
other = "{{.File}} declares the error code {{.Code}}, which belongs to ncly."

["extension.code_twice"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Code}} an error code."
other = "{{.File}} declares the error code {{.Code}} twice."

["extension.code_exit"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Code}} an error code, and {{.Value}} the exit code it maps to. 1, 2, and 78 are exit codes and stay as is."
other = "{{.File}} maps the error code {{.Code}} to exit {{.Value}}, and an extension's code maps to 1, 2, or 78."

["extension.catalog_id"]
description = "Reason inside extension.invalid. {{.File}} is the name of the extension's English catalog, such as ncly-hello.locales/en.toml, and {{.Value}} a catalog ID that the manifest names."
other = "{{.File}} lacks the ID \"{{.Value}}\" that the manifest names."

["extension.start_failed"]
description = "Error when ncly could not start an extension that it found. {{.Domain}} is its domain, such as hello, and stays as is."
other = "The extension {{.Domain}} could not start."

["extension.answer_exit"]
description = "Error when an extension exited with a code that the contract does not allow. {{.Domain}} is its domain, and {{.Exit}} the exit code, a number."
other = "The extension {{.Domain}} exited with {{.Exit}}, which is not an exit code of the contract."

["extension.answer_two_places"]
description = "Error when an extension failed but also wrote on stdout, which stays empty on failure. {{.Domain}} is its domain, and {{.Exit}} its exit code. stdout is the name of a stream and stays as is."
other = "The extension {{.Domain}} failed with exit {{.Exit}} but wrote on stdout."

["extension.answer_missing"]

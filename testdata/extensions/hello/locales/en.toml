# English catalog of the hello fixture. Each entry needs a description of where the text appears.

["hello.summary"]
description = "Help page: summary of the hello fixture, which greets people."
other = "Greet people"

["hello.run.summary"]
description = "Help page: summary of hello run."
other = "Greet someone by name"

["hello.run.name"]
description = "Help page: the name argument of hello run."
other = "Name of the person to greet"

["hello.run.greeting"]
description = "Help page: the --greeting flag of hello run."
other = "Word to greet with"

["hello.run.grumpy"]
description = "Help page: the --grumpy flag of hello run, which makes it refuse."
other = "Refuse to greet"

["hello.check.summary"]
description = "Help page: summary of hello check, a report."
other = "Check that greetings work"

["hello.check.fail"]
description = "Help page: the --fail flag of hello check, which makes the report itself fail."
other = "Fail before checking anything"

["hello.say.summary"]
description = "Help page: summary of hello say, which prints plain text."
other = "Say hello as plain text"

["hello.say.name"]
description = "Help page: the name argument of hello say."
other = "Name of the person to greet"

["hello.wait.summary"]
description = "Help page: summary of hello wait, which runs a program until a signal arrives."
other = "Wait for a signal"

["hello.wait.stubborn"]
description = "Help page: the --stubborn flag of hello wait, which makes it ignore the signal."
other = "Keep waiting after a signal"

["hello.wait.stubborn_child"]
description = "Help page: the --stubborn-child flag of hello wait, whose program then ignores SIGTERM."
other = "Start a program that ignores SIGTERM"

["hello.greeting"]
description = "Text of hello run and hello say. {{.Greeting}} is a word such as Hello, and {{.Name}} a name."
other = "{{.Greeting}}, {{.Name}}!"

["hello.default_greeting"]
description = "The word that hello run greets with when --greeting is absent."
other = "Hello"

["hello.world"]
description = "The name that hello run greets when no name is given."
other = "world"

["hello.verbose"]
description = "Diagnostic line of hello run under --verbose. {{.Greeting}} is the greeting that it prints, such as Hello, Ada!"
other = "Greeting: {{.Greeting}}"

["hello.unnamed"]
description = "Warning when hello run or hello say gets no name and greets the world instead."
other = "No name was given, so hello greets the world."

["hello.empty_greeting"]
description = "Error when the --greeting flag of hello run is empty."
other = "The greeting cannot be empty."

["hello.grumpy"]
description = "Error when hello run refuses to greet, under --grumpy."
other = "Not today."

["hello.mood"]
description = "Text of hello check: its only check failed."
other = "The mood check failed."

["hello.config"]
description = "Error when hello check fails before checking anything, under --fail."
other = "The configuration of hello cannot be read."

["hello.program"]
description = "Error when hello wait could not start its program."
other = "The program of hello wait could not start."

["hello.pick.summary"]
description = "Help page: summary of hello pick, which picks a side for someone and writes the file picked."
other = "Pick a side for someone"

["hello.pick.name"]
description = "Help page: the name argument of hello pick."
other = "Name of the person"

["hello.pick.mood"]
description = "Help page: the --mood flag of hello pick, a required word."
other = "Mood of the pick"

["hello.pick.times"]
description = "Help page: the --times flag of hello pick, a whole number."
other = "How many times to pick"

["hello.pick.tag"]
description = "Help page: the --tag flag of hello pick, which takes several values."
other = "Tag to add, once per flag"

["hello.pick.left"]
description = "Help page: the --left flag of hello pick."
other = "Pick the left side"

["hello.pick.right"]
description = "Help page: the --right flag of hello pick."
other = "Pick the right side"

["hello.count.summary"]
description = "Help page: summary of hello count, which counts the lines of a file through a worker, a script that the fixture embeds."
other = "Count the lines of a file"

["hello.count.file"]
description = "Help page: the file argument of hello count."
other = "File to count"

["hello.count.timeout"]
description = "Help page: the --timeout flag of hello count, which bounds the run of its worker."
other = "Stop the count after this duration"

["hello.count.no_file"]
description = "Message of USAGE_INVALID when the file of hello count is missing or is no regular file. {{.File}} is the path that the caller gave."
other = "{{.File}} is no file that hello can count."

["hello.count.bad_timeout"]
description = "Message of USAGE_INVALID when the --timeout of hello count is no positive duration. {{.Timeout}} is the value that the caller gave, and --timeout stays as is."
other = "--timeout {{.Timeout}} is no positive duration, such as 30s."

["hello.count.lines"]
description = "Text of hello count: the number of lines of the file. {{.File}} is the path that the caller gave, and {{.Lines}} the number."
other = "Lines in {{.File}}: {{.Lines}}"

["hello.scan.summary"]
description = "Help page: summary of hello scan, which reads a file through a worker that prints its progress on stdout, as an encoder does."
other = "Scan a file line by line"

["hello.scan.file"]
description = "Help page: the file argument of hello scan."
other = "File to scan"

["hello.scan.no_file"]
description = "Message of USAGE_INVALID when the file of hello scan is missing or is no regular file. {{.File}} is the path that the caller gave."
other = "{{.File}} is no file that hello can scan."

["hello.scan.done"]
description = "Text of hello scan once its worker read the whole file. {{.File}} is the path that the caller gave."
other = "Scanned {{.File}}"

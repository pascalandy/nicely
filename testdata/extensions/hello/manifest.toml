format_version = 1
contract_version = 1
domain = "hello"

[[commands]]
path = "hello"
summary = "hello.summary"
examples = ["ncly hello run Ada", "ncly hello check --json"]

[[commands]]
path = "hello run"
summary = "hello.run.summary"
examples = ["ncly hello run Ada", "ncly hello run --greeting Hi Ada --json"]

[[commands.args]]
name = "name"
summary = "hello.run.name"

[[commands.flags]]
name = "greeting"
shorthand = "g"
value = "text"
summary = "hello.run.greeting"

[[commands.flags]]
name = "grumpy"
summary = "hello.run.grumpy"

[commands.result.schema]
type = "object"
required = ["greeting"]
properties = { greeting = { type = "string" } }

[[commands]]
path = "hello check"
summary = "hello.check.summary"
examples = ["ncly hello check", "ncly hello check --json"]

[[commands.flags]]
name = "fail"
summary = "hello.check.fail"

[commands.result]
kind = "report"

[commands.result.schema]
type = "object"
required = ["checks"]
properties = { checks = { type = "array", items = { "$ref" = "#/$defs/check" } } }

[commands.result.schema."$defs".check]
type = "object"
required = ["id", "status"]
properties = { id = { type = "string" }, status = { enum = ["ok", "warn", "fail"] } }

[[commands]]
path = "hello say"
summary = "hello.say.summary"
examples = ["ncly hello say Ada", "ncly hello say Ada --json"]
result = { kind = "text" }

[[commands.args]]
name = "name"
summary = "hello.say.name"

[[commands]]
path = "hello wait"
summary = "hello.wait.summary"
examples = ["ncly hello wait", "ncly hello wait --json"]

[[commands.flags]]
name = "stubborn"
summary = "hello.wait.stubborn"

[[commands.flags]]
name = "stubborn-child"
summary = "hello.wait.stubborn_child"

[commands.result.schema]
type = "object"
required = ["output_dir"]
properties = { output_dir = { type = "string" } }

[[commands]]
path = "hello pick"
summary = "hello.pick.summary"
examples = ["ncly hello pick Ada --mood calm --left", "ncly hello pick Ada --mood calm --right --times 2 --json"]
effects = { user_writes = true }
modes = { dry_run = true, recorded = true }

[[commands.args]]
name = "name"
summary = "hello.pick.name"
required = true

[[commands.flags]]
name = "mood"
value = "word"
required = true
summary = "hello.pick.mood"

[[commands.flags]]
name = "times"
value = "n"
type = "integer"
default = 1
summary = "hello.pick.times"

[[commands.flags]]
name = "tag"
value = "text"
variadic = true
summary = "hello.pick.tag"

[[commands.flags]]
name = "left"
summary = "hello.pick.left"

[[commands.flags]]
name = "right"
summary = "hello.pick.right"

[[commands.flag_groups]]
flags = ["left", "right"]
min = 1
max = 1

[commands.result.schema]
type = "object"
required = ["picked", "args", "flags", "lists"]
properties = { picked = { type = "string" }, args = { "$ref" = "#/$defs/words" }, flags = { type = "object", additionalProperties = { type = "string" } }, lists = { type = "object", additionalProperties = { "$ref" = "#/$defs/words" } } }
"$defs" = { words = { type = "array", items = { type = "string" } } }

[commands.result.dry_run_schema]
type = "object"
required = ["planned", "args", "flags", "lists"]
properties = { planned = { const = "picked" }, args = { type = "array", items = { type = "string" } }, flags = { type = "object" }, lists = { type = "object" } }

[[commands]]
path = "hello count"
summary = "hello.count.summary"
examples = ["ncly hello count notes.md", "ncly hello count notes.md --json"]
effects = {}
requires = { bins = ["bash"] }

[[commands.args]]
name = "file"
summary = "hello.count.file"
required = true

[[commands.flags]]
name = "timeout"
value = "duration"
default = "10s"
summary = "hello.count.timeout"

[commands.result.schema]
type = "object"
required = ["lines"]
properties = { lines = { type = "integer", minimum = 0 } }

[[commands]]
path = "hello scan"
summary = "hello.scan.summary"
examples = ["ncly hello scan notes.md", "ncly hello scan notes.md --json"]
effects = {}
requires = { bins = ["bash"] }

[[commands.args]]
name = "file"
summary = "hello.scan.file"
required = true

[commands.result.schema]
type = "object"
required = ["file"]
properties = { file = { type = "string" } }

[programs.bash]
version = "3.2"

[[errors]]
code = "HELLO_GRUMPY"
exit = 1

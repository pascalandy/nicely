# The extension template, as D062 in docs/north-star/decisions/ decides. Each
# Nicely tag is a template version, and
# docs/north-star/contract/extension-repository.md holds the layout that it renders.
# An agent creates a repository without prompts, with the Copier that the
# line copier := of template/justfile pins, as the nicely-extensions skill shows:
#
#   uv tool run copier@<pinned version> copy --vcs-ref VERSION --defaults \
#     --data domain=notes --data module=github.com/me/ncly-notes \
#     gh:pascalandy/nicely ncly-notes
#
# VERSION is the release tag that ncly --version prints.
#
# The template has no tasks, no migrations, and no Jinja extension, so
# Copier needs no --trust. scripts/template-test.sh renders it in just check.
_subdirectory: template

# go.mod holds the dependencies of the author, so the repository owns it after
# its first render, as #347 U1 found. just update moves its Nicely pin with go
# get, and copies the replace lines of Nicely's go.mod.
_skip_if_exists:
  - go.mod

domain:
  type: str
  help: The domain of the extension, lowercase letters and digits that start with a letter, such as notes
  validator: >-
    {% if not (domain or "") | regex_search("^[a-z][a-z0-9]*\\Z") %}
    Give a domain of lowercase letters and digits that starts with a letter: --data domain=notes
    {% elif domain in ["auth", "completion", "config", "core", "describe", "doctor", "extensions", "help", "run", "skill", "tap", "version"] %}
    ncly reserves the name {{ domain }}: choose another domain
    {% elif domain == "nicely" %}
    ncly bundles the skill nicely and skills named nicely-<topic>, which would hide the skill of the extension: choose another domain
    {% elif domain in ["main", "break", "case", "chan", "const", "continue", "default", "defer", "else", "fallthrough", "for", "func", "go", "goto", "if", "import", "interface", "map", "package", "range", "return", "select", "struct", "switch", "type", "var"] %}
    {{ domain }} cannot name the Go package of the extension, which other packages import: choose another domain
    {% endif %}

name:
  type: str
  default: ""
  help: One job in the domain, such as convert; leave empty for a whole-domain extension
  validator: >-
    {% if name and not name | regex_search("^[a-z][a-z0-9]*\\Z") %}
    Give one name of lowercase letters and digits that starts with a letter: choose another name
    {% endif %}

slug:
  type: str
  default: "{{ domain }}{% if name %}-{{ name }}{% endif %}"
  when: false
  validator: >-
    {% if slug != (domain ~ ("-" ~ name if name else "")) %}
    Pass only domain, name, and module; slug is derived from those inputs.
    {% endif %}
root:
  type: str
  default: "{{ domain }}{% if name %} {{ name }}{% endif %}"
  when: false
  validator: >-
    {% if root != (domain ~ (" " ~ name if name else "")) %}
    Pass only domain, name, and module; root is derived from those inputs.
    {% endif %}
example_command:
  type: str
  default: "{{ root }}{% if not name %} inspect{% endif %}"
  when: false
  validator: >-
    {% if example_command != (root ~ (" inspect" if not name else "")) %}
    Pass only domain, name, and module; example_command is derived from those inputs.
    {% endif %}

module:
  type: str
  help: The Go module path of the repository, such as github.com/me/ncly-video-convert
  validator: >-
    {% if not (module or "") | regex_search("^[a-z0-9][-a-z0-9.]*(/[-A-Za-z0-9._~]+)+$") %}
    Give the Go module path of the repository: --data module=github.com/me/ncly-{{ slug }}
    {% endif %}

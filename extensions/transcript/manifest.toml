format_version = 1
contract_version = 1
domain = "transcript"

[[commands]]
path = "transcript"
summary = "transcript.summary"
examples = ["ncly transcript run youtube --url \"https://www.youtube.com/watch?v=VIDEO_ID\" --dry-run"]

[[commands]]
path = "transcript run"
summary = "transcript.run.summary"
examples = ["ncly transcript run youtube --url \"https://www.youtube.com/watch?v=VIDEO_ID\" --dry-run"]

[[commands]]
path = "transcript run youtube"
summary = "transcript.run.youtube.summary"
examples = ["ncly transcript run youtube --url \"https://www.youtube.com/watch?v=VIDEO_ID\" --dry-run --json", "ncly transcript run youtube --url \"https://www.youtube.com/watch?v=VIDEO_ID\" --run-id video-notes-1 --json"]
effects = { user_writes = true, network = true, paid = true }
modes = { dry_run = true, recorded = true }
config = ["transcript.browser", "transcript.youtube.output"]
requires = { bins = ["uv", "python3"], keys = ["deepgram"] }

[[commands.flags]]
name = "url"
value = "url"
required = true
summary = "transcript.run.youtube.url"

[[commands.flags]]
name = "output"
value = "folder"
summary = "transcript.run.youtube.output"

[[commands.flags]]
name = "timeout"
value = "duration"
summary = "transcript.run.youtube.timeout"
default = "570s"

[commands.result]
kind = "batch"

[commands.result.schema]
type = "object"
required = ["run_id"]

[commands.result.schema.properties]
run_id = { type = "string" }
results = { type = "array", minItems = 1, maxItems = 1, items = { "$ref" = "#/$defs/item" } }

[commands.result.schema."$defs".item]
type = "object"
required = ["url", "output_dir", "transcript"]
properties = { url = { type = "string" }, output_dir = { type = ["string", "null"] }, transcript = { type = ["string", "null"] } }

[commands.result.dry_run_schema]
type = "object"
required = ["dry_run", "plan", "pending_checks"]

[commands.result.dry_run_schema.properties]
dry_run = { const = true }
plan = { type = "array", items = { "$ref" = "#/$defs/item" }, minItems = 1, maxItems = 1 }
pending_checks = { type = "array", items = { "$ref" = "#/$defs/check" } }

[commands.result.dry_run_schema."$defs".item]
type = "object"
required = ["key", "steps", "effects"]
oneOf = [{ required = ["output"] }, { required = ["output_dir"] }]
properties = { key = { type = "string" }, output = { type = "string" }, output_dir = { type = "string" }, steps = { type = "array", items = { "$ref" = "#/$defs/step" } }, effects = { "$ref" = "#/$defs/effects" } }

[commands.result.dry_run_schema."$defs".step]
type = "object"
required = ["id", "action"]
properties = { id = { const = "transcribe" }, action = { enum = ["run", "reuse"] } }

[commands.result.dry_run_schema."$defs".effects]
type = "object"
required = ["user_writes", "network", "paid"]
properties = { user_writes = { type = "boolean" }, network = { type = "boolean" }, paid = { type = "boolean" } }

[commands.result.dry_run_schema."$defs".check]
type = "object"
required = ["id", "message"]
properties = { id = { type = "string" }, message = { type = "string" } }

[programs.uv]
install = { brew = ["brew", "install", "uv"], pacman = ["sudo", "pacman", "-S", "uv"] }

[programs.python3]
version = "3.12"
install = { brew = ["brew", "install", "python@3.13"], pacman = ["sudo", "pacman", "-S", "python"] }

[[errors]]
code = "TRANSCRIPT_DOWNLOAD_FAILED"
exit = 1

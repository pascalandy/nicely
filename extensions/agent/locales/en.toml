# English catalog of the agent extension. Each entry needs a description of where the text appears.

["agent.summary"]
description = "Summary of the agent domain in `ncly --help`. Codex is the name of a program and stays as is."
other = "Run trusted tasks through Codex"

["agent.run.summary"]
description = "Summary of `ncly agent run`. Codex is the name of a program and stays as is."
other = "Run one trusted task through Codex"

["agent.run.task"]
description = "Help of `ncly agent run`: the task argument, the instructions that Codex receives."
other = "The task for Codex, as text"

["agent.run.task_file"]
description = "Help of `ncly agent run`: the --task-file flag, a file that holds the task instead of the task argument."
other = "Read the task from a file"

["agent.run.tools"]
description = "Help of `ncly agent run`: the --tools switch, which lets Codex use its tools, such as running commands. The command requires it."
other = "Let Codex use its tools, which this command requires"

["agent.run.model"]
description = "Help of `ncly agent run`: the --model flag, which overrides model in the [agent] table of the config. [agent] stays as is."
other = "The model of Codex, instead of model in [agent]"

["agent.run.effort"]
description = "Help of `ncly agent run`: the --effort flag, a reasoning effort, which overrides effort in the [agent] table of the config. [agent] stays as is."
other = "The reasoning effort, instead of effort in [agent]"

["agent.run.cwd"]
description = "Help of `ncly agent run`: the --cwd flag, the folder where Codex works."
other = "The folder where Codex works, the current one by default"

["agent.run.timeout"]
description = "Help of `ncly agent run`: the --timeout flag, the limit of the whole call, and its default, 5 minutes. Codex is the name of a program, and 5m a duration, which stay as is."
other = "Stop the call and Codex after this duration, 5m by default"

["agent.run.planned"]
description = "ncly agent run --dry-run, human text: the line before the command that execution would run, which follows on the next line. {{.Version}} is the version of Codex, such as 0.163.0. Codex is the name of a program and stays as is."
other = "Would run Codex {{.Version}} with this command, and give it the task on its input:"

["agent.run.planned_model"]
description = "ncly agent run --dry-run, human text: the model that Codex would use. {{.Model}} is a model ID, which stays as is."
other = "model: {{.Model}}"

["agent.run.planned_effort"]
description = "ncly agent run --dry-run, human text: the reasoning effort that Codex would use. {{.Effort}} is a value such as medium, which stays as is."
other = "effort: {{.Effort}}"

["agent.run.planned_cwd"]
description = "ncly agent run --dry-run, human text: the folder where Codex would work. {{.Dir}} is an absolute path."
other = "folder: {{.Dir}}"

["agent.run.planned_environment"]
description = "ncly agent run --dry-run, human text: a variable that Nicely sets for Codex. {{.Variable}} is its name, such as NCLY_AGENT_DEPTH, and {{.Value}} its value, both of which stay as is."
other = "environment: {{.Variable}}={{.Value}}"

["agent.run.pending"]
description = "ncly agent run --dry-run, human text: one check that only execution makes. {{.ID}} is its id, such as agent.login, which stays as is, and {{.Message}} what it checks."
other = "pending  {{.ID}}  {{.Message}}"

["agent.run.pending_login"]
description = "ncly agent run --dry-run: the message of the pending check agent.login. A dry run starts no task, so only execution finds out whether the login of Codex works. Codex is the name of a program and stays as is."
other = "Codex checks its login only when it runs the task."

["agent.run.task_missing"]
description = "Error USAGE_INVALID of `ncly agent run` when the call gives neither a task argument nor --task-file."
other = "The task is missing."

["agent.run.task_twice"]
description = "Error USAGE_INVALID of `ncly agent run` when the call gives both a task argument and --task-file."
other = "Give the task either as an argument or with --task-file, not both."

["agent.run.task_empty"]
description = "Error USAGE_INVALID of `ncly agent run` when the task holds nothing but spaces and line breaks."
other = "The task is empty."

["agent.run.task_hint"]
description = "Hint under a USAGE_INVALID error about the task of `ncly agent run`: the two forms of the call. <task> and <file> are placeholders, and the rest is a command that stays as is."
other = "ncly agent run (<task> | --task-file <file>) --tools"

["agent.run.task_unreadable"]
description = "Error USAGE_INVALID of `ncly agent run` when the file of --task-file cannot be read, such as a missing file or a folder. {{.File}} is the path that the call gave."
other = "Cannot read the task file {{.File}}."

["agent.run.task_not_file"]
description = "Error USAGE_INVALID of `ncly agent run` when --task-file names something other than a regular file, such as a folder, a pipe, a device, or /dev/stdin, which ncly never reads. {{.File}} is the path that the call gave."
other = "{{.File}} is not a regular file, so it cannot hold the task."

["agent.run.task_is_input"]
description = "Error USAGE_INVALID of `ncly agent run` when --task-file names the input of ncly, such as /dev/stdin when a file feeds it, which the command never reads. {{.File}} is the path that the call gave. ncly is the name of the program and stays as is."
other = "{{.File}} is the input of ncly, which this command never reads."

["agent.run.task_is_input_hint"]
description = "Hint under the error agent.run.task_is_input: what the user does next, which removes the redirection of the file to stdin, such as < task.md. --task-file is a flag, and ncly the name of the program, which stay as is."
other = "Give --task-file the path of the task file, and do not also send that file to the input of ncly."

["agent.run.task_unreadable_hint"]
description = "Hint under the error agent.run.task_unreadable: what the user does next. --task-file is a flag and stays as is."
other = "Give --task-file a file that you can read."

["agent.run.model_missing"]
description = "Error USAGE_INVALID of `ncly agent run` when neither --model nor model in the [agent] table of the config gives a model, or gives an empty one. [agent] and model stay as is."
other = "No model is set for Codex."

["agent.run.model_missing_hint"]
description = "Hint under the error agent.run.model_missing. --model, <id>, model, and [agent] stay as is. {{.File}} is the path of the shared config file."
other = "Add --model <id> to the call, or set model in the [agent] table of {{.File}}."

["agent.run.cwd_invalid"]
description = "Error USAGE_INVALID of `ncly agent run` when --cwd names no folder that exists. {{.Dir}} is the path that the call gave."
other = "{{.Dir}} is not a folder."

["agent.run.cwd_invalid_hint"]
description = "Hint under the error agent.run.cwd_invalid: what the user does next. --cwd is a flag and stays as is."
other = "Give --cwd a folder that exists."

["agent.run.tools_required"]
description = "Error CAPABILITY_UNSUPPORTED of `ncly agent run` without --tools: Codex has no verified switch that turns all its tools off, such as running commands, so the command runs only with them. Codex is the name of a program and stays as is."
other = "Codex cannot run a task with its tools turned off."

["agent.run.tools_required_hint"]
description = "Hint under the error agent.run.tools_required: what the user does next. --tools is a flag and stays as is."
other = "Add --tools to the call when Codex may use its tools."

["agent.run.manifest"]
description = "Error RUNTIME of `ncly agent run` when the extension cannot read its own manifest, which never happens in a build that passed its tests."
other = "The agent extension cannot read its own manifest."

["agent.config_invalid"]
description = "Error CONFIG_INVALID of `ncly agent run` when a config file cannot be read or is invalid, with no line number. {{.File}} is the path of the file."
other = "{{.File}} is not a valid config file."

["agent.config_invalid_line"]
description = "Error CONFIG_INVALID of `ncly agent run` when a config file has an error on a known line. {{.File}} is the path of the file, and {{.Line}} a line number."
other = "{{.File}} has an error on line {{.Line}}."

["agent.config_value"]
description = "Error CONFIG_INVALID of `ncly agent run` when a key of the [agent] table holds a value of the wrong type, such as a number for model. {{.Key}} is the key, such as model, and {{.File}} the path of the file. [agent] stays as is."
other = "{{.Key}} in the [agent] table of {{.File}} is not text."

["agent.config_effort"]
description = "Error CONFIG_INVALID of `ncly agent run` when effort in the [agent] table is no known reasoning effort. {{.Effort}} is the value of the file, {{.Efforts}} lists the known ones, such as low, medium, high, and {{.File}} is the path of the file. effort and [agent] stay as is."
other = "effort in the [agent] table of {{.File}} is {{.Effort}}, which is none of {{.Efforts}}."

["agent.config_hint"]
description = "Hint under a CONFIG_INVALID error of `ncly agent run`: what the user does next. {{.File}} is the path of the config file."
other = "Fix {{.File}}."

["agent.codex_missing"]
description = "Error PREREQ_MISSING of `ncly agent run` when no folder of PATH holds codex. codex is the name of a program and stays as is."
other = "codex is not installed."

["agent.codex_old"]
description = "Error PREREQ_MISSING of `ncly agent run` when codex is older than the oldest version that works. {{.Found}} is the version that it printed, and {{.Version}} the oldest version that works. codex stays as is."
other = "codex {{.Found}} is older than {{.Version}}."

["agent.codex_probe_failed"]
description = "Error PREREQ_MISSING of `ncly agent run` when the version probe of codex exited with an error. {{.Probe}} is the command that ran, such as codex --version, which stays as is, and {{.Exit}} its exit code."
other = "{{.Probe}} exited with {{.Exit}}, so its version is unknown."

["agent.codex_no_version"]
description = "Error PREREQ_MISSING of `ncly agent run` when the version probe of codex printed no version number. {{.Probe}} is the command that ran, such as codex --version, which stays as is."
other = "{{.Probe}} printed no version."

["agent.codex_timed_out"]
description = "Error PREREQ_MISSING of `ncly agent run` when the version probe of codex did not answer in time, so ncly stopped it. {{.Probe}} is the command that ran, such as codex --version, which stays as is."
other = "{{.Probe}} did not answer in time, so its version is unknown."

["agent.codex_timed_out_hint"]
description = "Hint under the error agent.codex_timed_out: what the user does next. {{.Probe}} is the command that ran, such as codex --version, which stays as is."
other = "Check that {{.Probe}} answers, then make the call again."

["agent.codex_hint"]
description = "Hint under a PREREQ_MISSING error about codex when no install command is known for this machine. codex is the name of a program and stays as is."
other = "Install codex."

["agent.run.depth_limit"]
description = "Error AGENT_DEPTH_LIMIT of `ncly agent run` when the call already runs inside as many agents as max_depth of the [agent] table allows, so it starts no Codex. {{.Count}} is the number of agents above the call, from NCLY_AGENT_DEPTH, and {{.Max}} the limit. max_depth and [agent] stay as is."
one = "This call already runs inside {{.Count}} agent, and max_depth in [agent] allows {{.Max}}."
other = "This call already runs inside {{.Count}} agents, and max_depth in [agent] allows {{.Max}}."

["agent.run.depth_limit_hint"]
description = "Hint under the error agent.run.depth_limit: what the user does next. A human decides whether a deeper chain of agents may run. max_depth and [agent] stay as is, and {{.File}} is the path of the config file."
other = "Run the task from a shell outside the agents, or ask a human to raise max_depth in the [agent] table of {{.File}}."

["agent.run.depth_invalid"]
description = "Error USAGE_INVALID of `ncly agent run` when the variable NCLY_AGENT_DEPTH holds no whole number from 0, such as -1 or two. {{.Value}} is its value. NCLY_AGENT_DEPTH stays as is."
other = "NCLY_AGENT_DEPTH holds {{.Value}}, which is no whole number from 0."

["agent.run.depth_invalid_hint"]
description = "Hint under the error agent.run.depth_invalid: what the user does next. NCLY_AGENT_DEPTH stays as is."
other = "Unset NCLY_AGENT_DEPTH, or set it to the number of agents above this call."

["agent.config_max_depth"]
description = "Error CONFIG_INVALID of `ncly agent run` when max_depth in the [agent] table is no whole number from 1, such as 0, -1, or text. {{.File}} is the path of the file. max_depth and [agent] stay as is."
other = "max_depth in the [agent] table of {{.File}} is not a whole number from 1."

["agent.run.run_id_invalid"]
description = "Error USAGE_INVALID of `ncly agent run` when --run-id is no run ID. {{.ID}} is the value that the call gave. --run-id stays as is."
other = "{{.ID}} is no run ID."

["agent.run.run_id_invalid_hint"]
description = "Hint under the error agent.run.run_id_invalid: the rule of a run ID. --run-id stays as is."
other = "Give --run-id 1 to 64 lowercase letters, digits, and hyphens, starting with a letter or a digit."

["agent.run.busy"]
description = "Error TEMPORARY of `ncly agent run` when another process holds the run, so the call starts nothing. {{.ID}} is the run ID, which stays as is."
other = "Another process runs {{.ID}} now, so this call started nothing."

["agent.run.record_unreadable"]
description = "Error RESUME_UNSAFE of `ncly agent run` when the record of the run cannot be read or holds an unknown format, so the call starts no task. {{.File}} is the path of the record."
other = "Cannot read the record {{.File}}, so this call started no task."

["agent.run.record_failed"]
description = "Error RUNTIME of `ncly agent run` when the record of the run cannot be written before Codex starts, so no task starts. {{.Dir}} is the folder of the records."
other = "Cannot save the record of the run in {{.Dir}}, so no Codex task started."

["agent.run.record_failed_hint"]
description = "Hint under the error agent.run.record_failed: what the user does next. {{.Dir}} is the folder of the records."
other = "Check that you can write in {{.Dir}}, then make the call again."

["agent.run.timeout_invalid"]
description = "Error USAGE_INVALID of `ncly agent run` when --timeout is no duration above 0. {{.Value}} is the value that the call gave. --timeout stays as is."
other = "{{.Value}} is no valid timeout."

["agent.run.timeout_invalid_hint"]
description = "Hint under the error agent.run.timeout_invalid: the rule of a timeout. --timeout, 30s, 5m, and 2h stay as is."
other = "Give --timeout a duration above 0, such as 30s, 5m, or 2h, or a number of seconds."

["agent.run.timed_out_early"]
description = "Error RUNTIME of `ncly agent run` when the call reached its --timeout before Codex started its task, so no task ran. {{.Limit}} is the timeout, such as 5m, which stays as is. Codex is the name of a program and stays as is."
other = "The call reached its timeout of {{.Limit}} before Codex started, so no task ran."

["agent.run.timed_out_early_hint"]
description = "Hint under the error agent.run.timed_out_early when the call saved no record yet: what the user does next. --timeout stays as is."
other = "Give --timeout a longer duration, then make the call again."

["agent.run.stopped_early"]
description = "Error INTERRUPTED or TERMINATED of `ncly agent run` when Ctrl-C or SIGTERM came after the call saved the intent of the run, but before Codex started, so no task ran. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "A signal stopped the run {{.ID}} before Codex started, so no task ran."

["agent.run.start_failed"]
description = "Error RUNTIME of `ncly agent run` when ncly could not start Codex, or make the temporary folder of the run, after it saved the intent of the run, so no task ran. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "Codex could not start for {{.ID}}, so no task ran."

["agent.run.stopped"]
description = "Error INTERRUPTED or TERMINATED of `ncly agent run` when Ctrl-C or SIGTERM stopped Codex during its task, so its paid work may have happened. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "A signal stopped Codex during the run {{.ID}}, so its result is unknown."

["agent.run.stopped_after"]
description = "Error INTERRUPTED or TERMINATED of `ncly agent run` when Ctrl-C or SIGTERM came after the call saved the answer of Codex and the completion of the run, so the answer stays saved. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "A signal stopped the call after the run {{.ID}} saved the answer of Codex, so the run is complete."

["agent.run.timed_out"]
description = "Error RUNTIME of `ncly agent run` when the call reached its --timeout during the task of Codex, so its paid work may have happened. {{.Limit}} is the timeout, such as 5m, which stays as is. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "Codex did not finish within {{.Limit}} for {{.ID}}, so its result is unknown."

["agent.run.codex_failed"]
description = "Error RUNTIME of `ncly agent run` when Codex exited with an error after it started, so its paid work may have happened. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "Codex failed during the task of {{.ID}}, so its result is unknown."

["agent.run.answer_missing"]
description = "Error RUNTIME of `ncly agent run` when Codex exited without error but wrote no answer, so its paid work may have happened. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "Codex gave no answer for {{.ID}}, so its result is unknown."

["agent.run.publish_failed"]
description = "Error RUNTIME of `ncly agent run` when ncly could not save the answer that Codex gave, or the completion of the run. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "Cannot save the answer of Codex for {{.ID}}, so the run stays unknown."

["agent.run.answer_changed"]
description = "Error RESUME_UNSAFE of `ncly agent run` when the saved answer of a run no longer matches the size and SHA-256 that its record holds. {{.File}} is the path of the answer."
other = "{{.File}} changed since the run saved it."

["agent.run.other_call"]
description = "Error USAGE_INVALID of `ncly agent run` when the record of the run ID holds another call: another task, folder, or flag. The call starts no task. {{.ID}} is the run ID, which stays as is."
other = "The run {{.ID}} holds another call, with another task, folder, or flag, so this call started no task."

["agent.run.effect_unknown"]
description = "Error RESUME_UNSAFE of `ncly agent run` when the record of the run ID shows a Codex task that may have started, with no saved answer, so it may have billed. The call starts no task. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "The run {{.ID}} may have started a paid Codex task without saving its answer, so this call started no task."

["agent.run.planned_reuse"]
description = "ncly agent run --dry-run, human text, when the run ID names a completed run: the call would answer from its saved answer and start nothing. The model, the effort, and the folder follow on their own lines. {{.ID}} is the run ID, which stays as is. Codex is the name of a program and stays as is."
other = "Would answer from the saved run {{.ID}}, and start no Codex."

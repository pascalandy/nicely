format_version = 1
contract_version = 1
domain = "agent"

[[commands]]
path = "agent"
summary = "agent.summary"
examples = ["ncly agent run \"Review this branch\" --tools --dry-run", "ncly doctor agent"]

[[commands]]
path = "agent run"
summary = "agent.run.summary"
examples = ["ncly agent run \"Review this branch\" --tools --effort high --dry-run", "ncly agent run --task-file task.md --tools --dry-run --json"]
effects = { user_writes = true, network = true, paid = true }
modes = { dry_run = true }
config = ["agent.model", "agent.effort"]
requires = { bins = ["codex"] }

[[commands.args]]
name = "task"
summary = "agent.run.task"

[[commands.flags]]
name = "task-file"
value = "file"
summary = "agent.run.task_file"

[[commands.flags]]
name = "tools"
summary = "agent.run.tools"

[[commands.flags]]
name = "model"
value = "id"
summary = "agent.run.model"

[[commands.flags]]
name = "effort"
value = "level"
values = ["low", "medium", "high", "xhigh", "max", "ultra"]
summary = "agent.run.effort"

[[commands.flags]]
name = "cwd"
value = "dir"
summary = "agent.run.cwd"

[commands.result.dry_run_schema]
type = "object"
required = ["dry_run", "harness", "harness_version", "model", "effort", "cwd", "task_sha256", "invocation", "plan", "pending_checks"]

[commands.result.dry_run_schema.properties]
dry_run = { const = true }
harness = { const = "codex" }
harness_version = { type = "string" }
model = { type = "string", minLength = 1 }
effort = { enum = ["low", "medium", "high", "xhigh", "max", "ultra"] }
cwd = { type = "string" }
task_sha256 = { type = "string", pattern = "^[0-9a-f]{64}$" }
invocation = { type = "array", items = { type = "string" } }
plan = { type = "array", items = { "$ref" = "#/$defs/item" }, minItems = 1, maxItems = 1 }
pending_checks = { type = "array", items = { "$ref" = "#/$defs/check" } }

[commands.result.dry_run_schema."$defs".item]
type = "object"
required = ["key", "output", "steps", "effects"]
properties = { key = { const = "task" }, output = { type = "string" }, steps = { type = "array", items = { "$ref" = "#/$defs/step" } }, effects = { "$ref" = "#/$defs/effects" } }

[commands.result.dry_run_schema."$defs".step]
type = "object"
required = ["id", "action"]
properties = { id = { const = "codex" }, action = { enum = ["run", "reuse"] } }

[commands.result.dry_run_schema."$defs".effects]
type = "object"
required = ["user_writes", "network", "paid"]
properties = { user_writes = { type = "boolean" }, network = { type = "boolean" }, paid = { type = "boolean" } }

[commands.result.dry_run_schema."$defs".check]
type = "object"
required = ["id", "message"]
properties = { id = { type = "string" }, message = { type = "string" } }

[programs.codex]
version = "0.162.1"
install = { brew = ["brew", "install", "--cask", "codex"], pacman = ["sudo", "pacman", "-S", "openai-codex"] }

format_version = 1
contract_version = 1
domain = "skill"

[[commands]]
path = "skill"
summary = "skill.summary"
examples = ["ncly skill list", "ncly skill view nicely"]

[[commands]]
path = "skill list"
summary = "skill.list.summary"
examples = ["ncly skill list", "ncly skill list --json"]
effects = {}
config = ["skill.paths"]

[commands.result.schema]
type = "object"
required = ["skills"]
properties = { skills = { type = "array", items = { "$ref" = "#/$defs/skill" } } }

[commands.result.schema."$defs".skill]
type = "object"
required = ["name", "description", "path", "source"]
properties = { name = { type = "string" }, description = { type = "string" }, path = { type = ["string", "null"] }, source = { type = "string" } }

[[commands]]
path = "skill view"
summary = "skill.view.summary"
examples = ["ncly skill view nicely", "ncly skill view nicely --json"]
effects = {}
config = ["skill.paths"]

[[commands.args]]
name = "name"
summary = "skill.view.name"
required = true
values_from = { command = "skill list", key = "skills", field = "name" }

[commands.result.schema]
type = "object"
required = ["name", "path", "source", "content"]
properties = { name = { type = "string" }, path = { type = ["string", "null"] }, source = { type = "string" }, content = { type = "string" } }

[[commands]]
path = "skill status"
summary = "skill.status.summary"
examples = ["ncly skill status", "ncly skill status --json", "ncly doctor skill"]
effects = {}
config = ["skill.paths"]
doctor = true

[commands.result]
kind = "report"

[commands.result.schema]
type = "object"
required = ["checks"]
properties = { checks = { type = "array", items = { "$ref" = "#/$defs/check" } } }

[commands.result.schema."$defs".check]
type = "object"
required = ["id", "component", "status", "message"]
properties = { id = { type = "string" }, component = { const = "skill" }, status = { enum = ["pass", "warn"] }, code = { type = "string" }, message = { type = "string" }, hint = { type = "string" } }

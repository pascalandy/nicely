# A push can skip the pre-push hook of Lefthook, so GitHub runs just check
# for each push to main and each pull request, as D016 decides. Releases stay
# manual, in release.yml.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # just limits compares with origin/main, and just gitleaks scans the whole history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.58.0'

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # The tests of tools/cmd/release-artifacts run ruby -c on the Homebrew formula,
      # and preflight-test.sh runs the real sqlite3 on a fake TCC.db (#371).
      - name: Install check tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes ruby sqlite3
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check
          # Ubuntu's ShellCheck and shfmt lag behind the versions on the maintainers' machines, so pin those
          curl --fail --silent --show-error --location \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "${RUNNER_TEMP}/shellcheck.tar.xz"
          printf '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  %s\n' "${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum --check
          curl --fail --silent --show-error --location \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 \
            --output "${RUNNER_TEMP}/shfmt"
          printf 'fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  %s\n' "${RUNNER_TEMP}/shfmt" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/check-bin"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}/check-bin" gitleaks
          tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}/check-bin" --strip-components=1 shellcheck-v0.11.0/shellcheck
          install -m 755 "${RUNNER_TEMP}/shfmt" "${RUNNER_TEMP}/check-bin/shfmt"
          printf '%s\n' "${RUNNER_TEMP}/check-bin" >>"${GITHUB_PATH}"

      - name: Run just check
        shell: bash
        run: just check

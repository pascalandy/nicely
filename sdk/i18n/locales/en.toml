# The SDK's English catalog: the text that the SDK renders for core and every
# Go extension. Each entry needs a description of where the text appears.

["extension.file_syntax"]
description = "Reason inside extension.invalid. {{.File}} is the name of the file, such as ncly-hello.toml, and {{.Line}} a line number. TOML is the name of a file format and stays as is."
other = "{{.File}} has a TOML syntax error on line {{.Line}}."

["extension.file_invalid"]
description = "Reason inside extension.invalid, when a file is not valid TOML or not a catalog. {{.File}} is the name of the file, such as ncly-hello.locales/en.toml."
other = "{{.File}} is not in the expected format."

["extension.format_version"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, format_version a key that stays as is, {{.Value}} the number it holds, and {{.Want}} the only number this ncly reads."
other = "{{.File}} has format_version {{.Value}}, and this ncly reads only {{.Want}}."

["extension.contract_version"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, contract_version a key that stays as is, {{.Value}} the number it holds, and {{.Want}} the only number this ncly speaks."
other = "{{.File}} has contract_version {{.Value}}, and this ncly speaks only {{.Want}}."

["extension.domain"]
description = "Reason inside extension.invalid for an invalid domain or mismatched whole-domain identity. {{.File}} is the manifest, {{.Value}} its declared domain, and {{.Want}} the executable slug."
other = "{{.File}} declares the domain \"{{.Value}}\" instead of {{.Want}}."

["extension.domain_command"]
description = "Reason inside extension.invalid. File is the manifest, and Path is the complete extension root."
other = "{{.File}} declares no command for the extension root {{.Path}}."

["extension.identity_name"]
description = "Invalid optional manifest name. File is the manifest, and Value is its name."
other = "{{.File}} declares the invalid name \"{{.Value}}\". Use lowercase letters and digits, starting with a letter."

["extension.identity_slug"]
description = "Manifest identity mismatch. File is the manifest, Value is its declared slug, and Want is the executable slug."
other = "{{.File}} declares the slug \"{{.Value}}\" instead of {{.Want}}."

["extension.domain_name"]
description = "SDK Check error for an invalid embedded manifest domain. {{.File}} is manifest.toml, and {{.Value}} is its domain. Domains start with a lowercase letter and contain only lowercase letters and digits."
other = "{{.File}} declares the invalid domain \"{{.Value}}\". Use lowercase letters and digits, starting with a letter."

["extension.path"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Path}} a command path, such as hello run."
other = "{{.File}} declares the command \"{{.Path}}\", whose words must be lowercase letters, digits, and hyphens."

["extension.path_domain"]
description = "Reason inside extension.invalid. {{.File}} is the manifest, {{.Path}} a command path, and {{.Domain}} the complete extension root, which must start that path."
other = "{{.File}} declares the command \"{{.Path}}\", which does not start with {{.Domain}}."

["extension.path_twice"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Path}} a command path, such as hello run."
other = "{{.File}} declares the command \"{{.Path}}\" twice."

["extension.parent"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path such as hello profile list, and {{.Parent}} the path above it, such as hello profile."
other = "{{.File}} declares the command \"{{.Path}}\" without \"{{.Parent}}\" above it."

["extension.result"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Value}} the kind of result it declares, which ncly does not know."
other = "{{.File}} gives the command \"{{.Path}}\" the unknown result kind \"{{.Value}}\"."

["extension.name"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of one of its flags, arguments, or values."
other = "{{.File}} gives the command \"{{.Path}}\" the name \"{{.Name}}\", which must be lowercase letters, digits, and hyphens."

["extension.shorthand"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the shorthand of one of its flags, such as g in -g."
other = "{{.File}} gives the command \"{{.Path}}\" the shorthand \"{{.Name}}\", which must be one ASCII letter."

["extension.values_from_switch"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of one of its flags, a switch. values_from is a key and stays as is."
other = "{{.File}} gives the switch \"{{.Name}}\" of the command \"{{.Path}}\" a values_from, which only an argument or a flag that takes a value may have."

["extension.values_from_empty"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of one of its arguments or flags. values_from, command, key, and field are keys and stay as is."
other = "{{.File}} gives \"{{.Name}}\" of the command \"{{.Path}}\" a values_from without its command, key, and field."

["extension.values_from_command"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, {{.Name}} the name of one of its arguments or flags, and {{.Command}} the path of a command of the same manifest. values_from and list are words of the contract and stay as is."
other = "{{.File}} gives \"{{.Name}}\" of the command \"{{.Path}}\" a values_from on \"{{.Command}}\", which must be a list command of the manifest that takes no argument, answers an object, and declares effects that neither write user files nor bill."

["extension.flag_taken"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} a flag such as --json, --dry-run, or -v. --dry-run and --run-id are flags and stay as is."
other = "{{.File}} gives the command \"{{.Path}}\" the flag {{.Name}}, which a global flag, --dry-run, --run-id, or another of its flags already uses."

["extension.type"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, {{.Name}} the name of one of its arguments or flags, and {{.Value}} the type it declares. string, boolean, integer, and number are type names and stay as is."
other = "{{.File}} gives \"{{.Name}}\" of the command \"{{.Path}}\" the type \"{{.Value}}\", and a value is a string, boolean, integer, or number, a switch a boolean."

["extension.required"]
description = "Reason inside extension.invalid, when a switch or an argument after an optional one is required. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of the argument or the flag."
other = "{{.File}} makes \"{{.Name}}\" of the command \"{{.Path}}\" required, which neither a switch nor an argument after an optional one may be."

["extension.variadic"]
description = "Reason inside extension.invalid, when a switch or an argument other than the last takes several values. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of the argument or the flag."
other = "{{.File}} makes \"{{.Name}}\" of the command \"{{.Path}}\" take several values, which only the last argument and a flag that takes a value may."

["extension.values"]
description = "Reason inside extension.invalid, when the accepted values of an argument or a flag do not fit it. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of the argument or the flag. values is a key and stays as is."
other = "{{.File}} gives \"{{.Name}}\" of the command \"{{.Path}}\" values that do not fit it: none, one that appears twice, one that its type does not read, or values on a switch."

["extension.default"]
description = "Reason inside extension.invalid, when the default of a flag does not fit it. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the name of the flag."
other = "{{.File}} gives the flag \"{{.Name}}\" of the command \"{{.Path}}\" a default that does not fit it: of another type, a number that is not finite, a default on a required flag or a flag with several values, or a switch's default other than false."

["extension.flag_group"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Value}} the flags of one of its groups, such as --latest, --path. min and max are keys and stay as is."
other = "{{.File}} gives the command \"{{.Path}}\" the group of flags {{.Value}}, and a group names at least two of the command's own flags, each once, with 0 <= min <= max <= their number and max at least 1."

["extension.bin"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} a program name from its requires.bins. requires.bins and programs are keys and stay as is."
other = "{{.File}} lists \"{{.Name}}\" in requires.bins of the command \"{{.Path}}\", which must name a key of programs once."

["extension.program_version"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Name}} a program of its programs table, such as ffmpeg, and {{.Value}} the version that it declares."
other = "{{.File}} gives the program \"{{.Name}}\" the version \"{{.Value}}\", which must be numbers joined by dots, such as 6.0."

["extension.program_probe"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Name}} a program of its programs table, such as ffmpeg, whose probe, the arguments that make it print its version, is empty."
other = "{{.File}} gives the program \"{{.Name}}\" an empty probe, which must hold at least one argument."

["extension.program_install"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Name}} a program of its programs table, such as ffmpeg, and {{.Manager}} the name of a package manager, such as brew or pacman, which stays as is."
other = "{{.File}} gives the program \"{{.Name}}\" an empty install command for \"{{.Manager}}\"."

["extension.doctor"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Path}} a command path, such as hello run, which sets doctor, a key that stays as is, as do report, live, timeout, effects, and the mode names."
other = "{{.File}} sets doctor on the command \"{{.Path}}\", which must be the status command of its domain: <domain> status, a report without arguments or flag groups, whose only flags are live, a switch that defaults to false, and timeout, a string, neither required nor with values, with effects that neither write nor bill, live when they use the network, and no mode."

["extension.key"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} a service name from its requires.keys, such as deepgram. requires.keys, keychain, and grants stay as is."
other = "{{.File}} lists \"{{.Name}}\" in requires.keys of the command \"{{.Path}}\", which must name a service once, in lowercase letters and digits that start with a letter, other than keychain and grants."

["extension.config_key"]
description = "Reason inside extension.invalid. {{.File}} is the manifest, {{.Path}} a command path, and {{.Name}} a declared config key, such as video-convert.preset. {{.Domain}} is the extension slug, which starts each key. config is a key and stays as is."
other = "{{.File}} lists \"{{.Name}}\" in config of the command \"{{.Path}}\", which must name a key under {{.Domain}} once, as words of lowercase letters, digits, hyphens, and underscores joined by dots."

["extension.schema"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Path}} a command path, and {{.Name}} the key of a schema, schema or dry_run_schema, which stays as is, as do JSON Schema, $ref, type, properties, required, title, description, and text."
other = "{{.File}} gives the command \"{{.Path}}\" a {{.Name}} that is not a JSON Schema of an object's keys, with only type, properties, required, title, and description at its top and local $ref only, or that a text result, or a command without dry run for dry_run_schema, cannot have."

["extension.program"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Name}} a program of its programs table, such as ffmpeg. programs and requires.bins are keys and stay as is."
other = "{{.File}} declares the program \"{{.Name}}\" in programs, which must be a file name without / that the requires.bins of a command names."

["extension.key_table"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Name}} a service of its keys table, such as anthropic. keys and requires.keys are keys and stay as is."
other = "{{.File}} declares the service \"{{.Name}}\" in keys, which must be a service that the requires.keys of a command names."

["extension.key_optional"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Name}} a service of its keys table, such as anthropic, whose optional, a key that stays as is, holds a value that is not a boolean. true and false stay as is."
other = "{{.File}} gives the service \"{{.Name}}\" an optional that is neither true nor false."

["extension.code_prefix"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Code}} an error code, and {{.Prefix}} the start that the extension's codes need, such as HELLO_."
other = "{{.File}} declares the error code {{.Code}}, which does not start with {{.Prefix}}."

["extension.code_core"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Code}} an error code that belongs to ncly itself."
other = "{{.File}} declares the error code {{.Code}}, which belongs to ncly."

["extension.code_twice"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, and {{.Code}} an error code."
other = "{{.File}} declares the error code {{.Code}} twice."

["extension.code_exit"]
description = "Reason inside extension.invalid. {{.File}} is the manifest's name, {{.Code}} an error code, and {{.Value}} the exit code it maps to. 1, 2, and 78 are exit codes and stay as is."
other = "{{.File}} maps the error code {{.Code}} to exit {{.Value}}, and an extension's code maps to 1, 2, or 78."

["extension.declared_code_twice"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} names a repeated declaration across errors and warnings."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}} appears twice across errors and warnings."

["extension.warning_prefix"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} names a warning. {{.Prefix}} is its required uppercase prefix."
other = "{{.File}}:{{.Line}}:{{.Column}}: warning {{.Code}} must use uppercase letters, digits, and underscores, starting with {{.Prefix}}."

["extension.warning_core"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} names a warning declaration that uses a core code."
other = "{{.File}}:{{.Line}}:{{.Column}}: warning {{.Code}} belongs to ncly."

["extension.warning_exit"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} names a warning declaration with a forbidden exit field."
other = "{{.File}}:{{.Line}}:{{.Column}}: warning {{.Code}} must not declare exit."

["extension.code_commands_empty"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} has an empty commands scope."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}}: commands must name at least one command that runs."

["extension.code_command"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} scopes to {{.Path}}, which is missing or groups other commands."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}}: command \"{{.Path}}\" must name a declared command that runs."

["extension.code_command_twice"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} repeats {{.Path}} in its commands scope."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}}: command \"{{.Path}}\" appears twice."

["extension.code_modes_empty"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} has an empty modes scope."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}}: modes must contain run or dry_run."

["extension.code_mode"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} names a code. {{.Mode}} is an unknown execution mode."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}}: mode \"{{.Mode}}\" must be run or dry_run."

["extension.code_mode_twice"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} repeats {{.Mode}} in its modes scope."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}}: mode \"{{.Mode}}\" appears twice."

["extension.code_dry_run"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} selects dry_run for {{.Path}}, which does not offer it."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}}: command \"{{.Path}}\" does not offer dry_run. Narrow commands or modes."

["extension.code_untested"]
description = "Manifest rejection at {{.File}}:{{.Line}}:{{.Column}}. {{.Code}} has an untested exemption without both a reason and an issue URL."
other = "{{.File}}:{{.Line}}:{{.Column}}: code {{.Code}}: untested must give a reason and an issue URL."

["extension.catalog_id"]
description = "Reason inside extension.invalid. {{.File}} is the name of the extension's English catalog, such as ncly-hello.locales/en.toml, and {{.Value}} a catalog ID that the manifest names."
other = "{{.File}} lacks the ID \"{{.Value}}\" that the manifest names."

["flag.help"]
description = "Help page: description of the -h, --help flag."
other = "Show help for a command"

["flag.json"]
description = "Help page: description of the --json flag, which makes ncly answer with one JSON object on one line."
other = "Answer with one line of JSON"

["flag.lang"]
description = "Help page: description of the --lang flag. fr-CA is a language tag and stays as is."
other = "Language of human text, such as fr-CA"

["flag.no_color"]
description = "Help page: description of the --no-color flag."
other = "Print plain text"

["flag.no_input"]
description = "Help page: description of the --no-input flag, which stops ncly from asking questions."
other = "Never prompt, even in a terminal"

["flag.verbose"]
description = "Help page: description of the -v, --verbose flag, which adds step details on stderr."
other = "Add step details on stderr"

["flag.version"]
description = "Help page: description of the --version flag."
other = "Print the version"

["flag.dry_run"]
description = "Help page and ncly describe: description of the --dry-run flag, which a command that writes or bills accepts."
other = "Show the planned effects and pending checks without running"

["flag.run_id"]
description = "Help page and ncly describe: description of the --run-id flag of a recorded command, which names its run."
other = "Name the run, so a repeated call continues it"

["usage.unknown_command"]
description = "Error when a word is not a command. {{.Name}} is the word the user typed."
other = "Unknown command \"{{.Name}}\"."

["usage.unknown_command_suggestion"]
description = "Error when a word is not a command, but a command of the same group is close to it. {{.Name}} is the word the user typed, and {{.Suggestion}} the close command, such as describe, which stays as is."
other = "Unknown command \"{{.Name}}\". Did you mean \"{{.Suggestion}}\"?"

["usage.unexpected_argument"]
description = "Error when a command gets more arguments than it takes. {{.Arg}} is the first extra argument."
other = "Unexpected argument \"{{.Arg}}\"."

["usage.unknown_flag"]
description = "Error when a flag does not exist. {{.Flag}} is the flag as typed, such as --nope or -z."
other = "Unknown flag {{.Flag}}."

["usage.flag_needs_value"]
description = "Error when a flag that takes a value has none. {{.Flag}} is the flag, such as --lang."
other = "The flag {{.Flag}} needs a value."

["usage.invalid_flag_value"]
description = "Error when a flag gets a value it cannot accept. {{.Flag}} is the flag, {{.Value}} the value typed."
other = "The flag {{.Flag}} does not accept \"{{.Value}}\"."

["usage.missing_argument"]
description = "Error when a command lacks a required argument. {{.Name}} is the argument's name, such as name, shown in angle brackets as in the usage line."
other = "The argument <{{.Name}}> is missing."

["usage.missing_flag"]
description = "Error when a command lacks a required flag. {{.Flag}} is the flag, such as --path."
other = "The flag {{.Flag}} is missing."

["usage.invalid_argument_value"]
description = "Error when an argument's value does not fit its type or its accepted values. {{.Name}} is the argument's name, shown in angle brackets as in the usage line, and {{.Value}} what the user typed."
other = "The argument <{{.Name}}> does not accept \"{{.Value}}\"."

["usage.flag_group_exactly"]
description = "Error when a call does not set exactly {{.Count}} of a group of flags. {{.Flags}} lists the flags, such as --latest, --path."
one = "Give exactly one of {{.Flags}}."
other = "Give exactly {{.Count}} of {{.Flags}}."

["usage.flag_group_at_least"]
description = "Error when a call sets fewer than {{.Count}} of a group of flags. {{.Flags}} lists the flags, such as --latest, --path."
one = "Give at least one of {{.Flags}}."
other = "Give at least {{.Count}} of {{.Flags}}."

["usage.flag_group_at_most"]
description = "Error when a call sets more than {{.Count}} of a group of flags. {{.Flags}} lists the flags, such as --latest, --path."
one = "Give at most one of {{.Flags}}."
other = "Give at most {{.Count}} of {{.Flags}}."

["usage.invalid_flag_syntax"]
description = "Error when an argument looks like a flag but is malformed, such as ---x. {{.Arg}} is the argument."
other = "The argument {{.Arg}} is not a valid flag."

["usage.invalid"]
description = "Error when the command line is wrong in a way no other message covers."
other = "This command line is not valid."

["usage.invalid_variable"]
description = "Error when the variable of a global flag holds a value other than 1, 0, or nothing. {{.Name}} is the variable, such as NCLY_JSON, and {{.Value}} its value."
other = "The variable {{.Name}} does not accept \"{{.Value}}\"."

["usage.invalid_variable_hint"]
description = "Hint of usage.invalid_variable. {{.Name}} is the variable, such as NCLY_JSON. 1 and 0 are values and stay as is."
other = "Set {{.Name}} to 1 to turn it on, or to 0 to turn it off."

["usage.invalid_language"]
description = "Error when --lang or NCLY_LANG names no language, such as xx-YY. {{.Name}} is --lang or NCLY_LANG, and {{.Value}} the value that it holds."
other = "{{.Name}} holds \"{{.Value}}\", which is not a language tag."

["usage.invalid_language_hint"]
description = "Hint of usage.invalid_language. en and fr-CA are language tags and stay as is."
other = "Use a language tag, such as en or fr-CA."

["outcome.interrupted"]
description = "Error when Ctrl-C stopped a command. Finished files stay on disk."
other = "Stopped by Ctrl-C. Finished work is kept."

["outcome.terminated"]
description = "Error when the SIGTERM signal stopped a command. Finished files stay on disk."
other = "Stopped by SIGTERM. Finished work is kept."

["outcome.temporary"]
description = "Error when part of the work failed for a reason that may pass, and the same command is safe to run again."
other = "Some work failed for a reason that may pass."

["outcome.temporary_hint"]
description = "Hint under outcome.temporary: what the user does next."
other = "Run the same command again."

["outcome.runtime"]
description = "Error when part of the work failed and running the command again could repeat finished or paid work."
other = "Some work failed, and running it again could repeat finished work."

["outcome.check_hint"]
description = "Hint under an error after which an automatic retry is not safe: what the user does next."
other = "Check the results before you run anything again."

["output.write_failed"]
description = "Error when ncly could not write its result to the standard output, for example because the disk is full or the reader closed."
other = "Could not write the output."

["output.write_failed_hint"]
description = "Hint under output.write_failed: what the user checks before running the command again."
other = "Check the file or pipe that receives the output, such as its free space."

["duration.milliseconds"]
description = "A duration in milliseconds. {{.N}} is a number already formatted for the language, such as 250. ms is the unit symbol. The form follows {{.N}}."
one = "{{.N}} ms"
other = "{{.N}} ms"

["duration.seconds"]
description = "A duration in seconds. {{.N}} is a number already formatted, such as 1.5. s is the unit symbol. The form follows {{.N}}, decimals included."
one = "{{.N}} s"
other = "{{.N}} s"

["duration.minutes"]
description = "A duration in minutes. {{.N}} is a number already formatted, such as 1.5. min is the unit symbol. The form follows {{.N}}, decimals included."
one = "{{.N}} min"
other = "{{.N}} min"

["duration.hours"]
description = "A duration in hours. {{.N}} is a number already formatted, such as 1.5. h is the unit symbol. The form follows {{.N}}, decimals included."
one = "{{.N}} h"
other = "{{.N}} h"

["size.bytes"]
description = "A size in bytes. {{.N}} is a number already formatted for the language, such as 512. B is the symbol of the byte. The form follows {{.N}}."
one = "{{.N}} B"
other = "{{.N}} B"

["size.kilobytes"]
description = "A size in kilobytes, 1000 bytes each. {{.N}} is a number already formatted, such as 1.5. kB is the unit symbol. The form follows {{.N}}, decimals included."
one = "{{.N}} kB"
other = "{{.N}} kB"

["size.megabytes"]
description = "A size in megabytes, 1000 kilobytes each. {{.N}} is a number already formatted, such as 1.5. MB is the unit symbol. The form follows {{.N}}, decimals included."
one = "{{.N}} MB"
other = "{{.N}} MB"

["size.gigabytes"]
description = "A size in gigabytes, 1000 megabytes each. {{.N}} is a number already formatted, such as 1.5. GB is the unit symbol. The form follows {{.N}}, decimals included."
one = "{{.N}} GB"
other = "{{.N}} GB"

["size.terabytes"]
description = "A size in terabytes, 1000 gigabytes each. {{.N}} is a number already formatted, such as 1.5. TB is the unit symbol. The form follows {{.N}}, decimals included."
one = "{{.N}} TB"
other = "{{.N}} TB"

["help.effects"]
description = "Help page: one line under the summary of a command that changes files, uses the network, or may bill. {{.Effects}} lists them, such as `changes your files, uses the network`, from the help.effect_* entries joined by help.effect_separator."
other = "Effects: {{.Effects}}."

["help.effects_dry_run"]
description = "Help page: the line of help.effects for a command that supports --dry-run, which shows what it would do without doing it. {{.Flag}} is that flag, --dry-run."
other = "Effects: {{.Effects}}. Preview them with {{.Flag}}."

["help.effect_user_writes"]
description = "Help page: an item of help.effects, for a command that may change the user's files, config, keys, or grants."
other = "changes your files"

["help.effect_network"]
description = "Help page: an item of help.effects, for a command that may use the network."
other = "uses the network"

["help.effect_paid"]
description = "Help page: an item of help.effects, for a command that may send a paid request."
other = "may bill"

["help.effect_separator"]
description = "Help page: what joins two items of help.effects, with its spaces."
other = ", "

["help.usage"]
description = "Help page: heading above the line that shows how to call the command."
other = "Usage"

["help.commands"]
description = "Help page: heading above the list of commands."
other = "Commands"

["help.flags"]
description = "Help page: heading above the flags of this command."
other = "Flags"

["help.global_flags"]
description = "Help page: heading above the flags that every command accepts, such as --json."
other = "Global flags"

["help.examples"]
description = "Help page: heading above the example command lines."
other = "Examples"

["error.label"]
description = "Error block: label that leads an error message. {{.Code}} is a code such as USAGE_INVALID, which stays as is. French puts a space before the colon."
other = "error[{{.Code}}]:"

["warning.label"]
description = "Error block: label that leads a warning message. {{.Code}} is a code such as CONFIG_UNKNOWN_KEY, which stays as is. French puts a space before the colon."
other = "warning[{{.Code}}]:"

["error.hint"]
description = "Error block: label before the command or action that fixes an error or a warning, as in `hint: ncly --help`."
other = "hint:"

["outcome.extension_broken"]
description = "Error when a Go extension does not match its own manifest, such as a command without a handler. Only its developer can fix it."
other = "This extension does not match its own manifest."

["outcome.extension_broken_hint"]
description = "Hint under outcome.extension_broken: what the user does next. --verbose is a flag and stays as is."
other = "Report it to the extension's author, with the details that --verbose shows."

["form.key_enter"]
description = "Key help under a form, such as the masked field of a key: the name of the Enter key, which form.submit follows."
other = "enter"

["form.submit"]
description = "Key help under a form, after the name of the Enter key in form.key_enter: pressing it sends the answer."
other = "submit"

["form.up"]
description = "Key help under a choice of a form, after the arrow key ↑: pressing it moves to the option above."
other = "up"

["form.down"]
description = "Key help under a choice of a form, after the arrow key ↓: pressing it moves to the option below."
other = "down"

["form.filter"]
description = "Key help under a choice of a form, after the key /: pressing it starts typing a filter that narrows the options."
other = "filter"

["form.key_esc"]
description = "Key help under a choice of a form, while the human filters it: the name of the Escape key, which form.set_filter or form.clear_filter follows."
other = "esc"

["form.set_filter"]
description = "Key help under a choice of a form, after the name of the Escape key in form.key_esc, while the human types a filter: pressing it keeps the filter and returns to the options."
other = "set filter"

["form.clear_filter"]
description = "Key help under a choice of a form, after the name of the Escape key in form.key_esc, once a filter is set: pressing it removes the filter."
other = "clear filter"

["form.complete"]
description = "Key help under a text field of a form that suggests values, after the key ctrl+e: pressing it accepts the suggestion that the field shows."
other = "complete"

["form.number"]
description = "Prompt of a choice of a form on a terminal that cannot redraw a line, which lists the options as numbered lines above it. {{.Count}} is the number of the last option, at least 1, already formatted for the language. The form follows {{.Count}}. The human types a number after it."
one = "Type a number from 1 to {{.Count}}:"
other = "Type a number from 1 to {{.Count}}:"

["form.group_title"]
description = "Title of a choice in the form for missing values, which asks which flag of a group to set, such as --latest or --path. The description under it says how many to give."
other = "Pick a flag"

["form.next_time"]
description = "Line after a command that the form for missing values completed, followed on the next line by the equivalent command, which stays untranslated."
other = "Next time:"

["confirm.choices"]
description = "End of a confirmation in a terminal, after its question: the answers, with the default, No, in uppercase. Use the letters of confirm.yes for yes."
other = "[y/N]"

["confirm.yes"]
description = "The answers that confirm a confirmation, separated by commas, in lowercase. Any other answer means no. Include the letter that confirm.choices shows for yes."
other = "y, yes"

["key.not_granted"]
description = "Message of KEY_NOT_GRANTED that an extension answers: the command needs the key of a service, and no human granted that key to the extension. {{.Service}} is the service, such as deepgram, and {{.Domain}} the extension's domain, such as transcript."
other = "The key of {{.Service}} is not granted to {{.Domain}}."

["key.missing"]
description = "Message of AUTH_MISSING that an extension answers: neither the environment variable nor the OS keychain holds the key of a service that the command needs. {{.Service}} is the service, such as deepgram, and {{.Variable}} its variable, such as DEEPGRAM_API_KEY."
other = "No key for {{.Service}} in {{.Variable}} or the keychain."

["key.unavailable"]
description = "Message of KEYRING_UNAVAILABLE that an extension answers: the OS keychain does not answer, and the environment variable of a key that the command needs is empty. {{.Variable}} is the variable, such as DEEPGRAM_API_KEY."
other = "The keychain does not answer, and {{.Variable}} is empty."

["key.unavailable_hint"]
description = "Hint of KEYRING_UNAVAILABLE that an extension answers: the human exports the key's environment variable, such as DEEPGRAM_API_KEY, or unlocks the OS keychain. {{.Variable}} is the variable."
other = "Export {{.Variable}}, or unlock the keychain."

["key.undeclared"]
description = "Message of RUNTIME when an extension's code asks for the key of a service that its command does not declare in its manifest, so ncly never passes that key. {{.Path}} is the command path, such as transcript run youtube, and {{.Service}} the service. requires.keys stays as is."
other = "The command {{.Path}} asks for the key of {{.Service}}, which its requires.keys does not declare."

["wrap.undeclared"]
description = "Message of RUNTIME when an extension's code runs a program through sdk/wrap that its command does not declare in its manifest. {{.Path}} is the command path, such as hello count, and {{.Name}} the program, such as bash. requires.bins stays as is."
other = "The command {{.Path}} runs {{.Name}}, which its requires.bins does not declare."

["wrap.missing"]
description = "Message of PREREQ_MISSING when a program that a command runs is in no folder of PATH. {{.Name}} is the program, such as bash."
other = "{{.Name}} is not installed."

["wrap.too_old"]
description = "Message of PREREQ_MISSING when a program that a command runs is older than the version that the command needs. {{.Name}} is the program, {{.Found}} the version that it printed, such as 3.1, and {{.Version}} the oldest version that works."
other = "{{.Name}} {{.Found}} is older than {{.Version}}."

["wrap.probe_failed"]
description = "Message of PREREQ_MISSING when the version probe of a program that a command runs exited with an error. {{.Probe}} is the command that ran, such as bash --version, which stays as is, and {{.Exit}} its exit code."
other = "{{.Probe}} exited with {{.Exit}}, so its version is unknown."

["wrap.no_version"]
description = "Message of PREREQ_MISSING when the version probe of a program that a command runs printed no version number. {{.Probe}} is the command that ran, such as bash --version, which stays as is."
other = "{{.Probe}} printed no version."

["wrap.probe_timeout"]
description = "Message of PREREQ_MISSING when the version probe of a program that a command runs did not finish within its time limit. {{.Probe}} is the command that ran, such as bash --version, which stays as is."
other = "{{.Probe}} did not print its version in time."

["wrap.probe_timeout_hint"]
description = "Hint under wrap.probe_timeout: what the user does next. {{.Probe}} is the command that ran, such as bash --version, which stays as is."
other = "Check that {{.Probe}} prints a version and exits."

["wrap.install"]
description = "Hint of PREREQ_MISSING for a program that a command runs, when no install command is known for this machine. {{.Name}} is the program, such as bash."
other = "Install {{.Name}}."

["wrap.start_failed"]
description = "Message of RUNTIME when a program that a command runs through sdk/wrap could not start. {{.Name}} is the program, such as bash."
other = "{{.Name}} could not start."

["wrap.timeout"]
description = "Message of RUNTIME when a program that a command runs did not finish within the command's timeout, so ncly stopped it. {{.Name}} is the program, such as bash, and {{.Timeout}} the timeout, such as 10 s."
other = "{{.Name}} did not finish within {{.Timeout}}, so it was stopped."

["wrap.output_over"]
description = "Message of RUNTIME when a program that a command runs wrote more on stdout than the command reads. {{.Name}} is the program, such as bash, and {{.Limit}} the limit, such as 1 MB."
other = "{{.Name}} wrote more than {{.Limit}} of output."

["wrap.failed"]
description = "Message of RUNTIME when a program that a command runs exited with a code that the command does not expect. {{.Name}} is the program, such as bash, and {{.Exit}} its exit code."
other = "{{.Name}} failed with exit {{.Exit}}."

["wrap.malformed"]
description = "Message of RUNTIME when a program that a command runs gave output that the command cannot read, such as invalid JSON. {{.Name}} is the program, such as bash."
other = "{{.Name}} gave output that this command cannot read."

["worker.missing"]
description = "Message of RUNTIME when an extension's code asks for a worker, an embedded script, that the extension does not embed. Only its developer can fix it. {{.Name}} is the worker, such as count.sh."
other = "This extension embeds no worker named {{.Name}}."

["worker.extract_failed"]
description = "Message of RUNTIME when the SDK cannot write a worker, an embedded script, into a temporary folder before it runs. {{.Name}} is the worker, such as count.sh."
other = "The worker {{.Name}} could not be written to a temporary folder."

["worker.extract_failed_hint"]
description = "Hint under worker.extract_failed: what the user does next. TMPDIR is a variable and stays as is."
other = "Free some space, or set TMPDIR to a folder that you can write."
